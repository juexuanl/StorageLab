apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: storageworkspaces.storagelab.example.com
spec:
  group: storagelab.example.com
  scope: Namespaced
  names:
    plural: storageworkspaces
    singular: storageworkspace
    kind: StorageWorkspace
    shortNames:
      - sw
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - sizeGiB
              properties:
                sizeGiB:
                  type: integer
                  minimum: 1
                storageClassName:
                  type: string
                  default: standard
                webEnabled:
                  type: boolean
                  default: false
            status:
              type: object
              properties:
                phase:
                  type: string
                message:
                  type: string
      subresources:
        status: {}
