apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo-tunnel
  namespace: storagelab
  # This historical Deployment name now represents shared infrastructure.
  ownerReferences: []
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: web-demo-tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-demo-tunnel
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.3
          imagePullPolicy: IfNotPresent
          command: ["cloudflared"]
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - --protocol
            - http2
            - --url
            - http://workspace-gateway.storagelab.svc.cluster.local:80
          ports:
            - name: metrics
              containerPort: 2000
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
